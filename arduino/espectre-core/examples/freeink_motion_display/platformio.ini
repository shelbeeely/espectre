; ESPectre Core + FreeInk SDK example — platformio.ini
;
; Targets the Xteink X4 (ESP32-C3, SSD1677 800x480), the simplest single-device
; FreeInk target. Base flags/board copied from freeink-sdk's own
; platformio.sample.ini [base]/[env:xteink_x4] - see that file for every other
; supported device (M5 PaperColor, Murphy M3, de-link, LilyGo T5 S3, M5Paper
; v1.1, Sticky, Paper Mono, X4 Pro): swap board/build_flags accordingly and
; the espectre-core lines below need no change.
;
; Prerequisites:
;   - The FreeInk SDK, vendored as a git submodule at arduino/freeink-sdk -
;     referenced below as ../../../freeink-sdk. Clone this repo with
;     `git submodule update --init` (or `git clone --recursive`) to fetch it.
;   - This espectre-core library, referenced as ../../ (its own directory,
;     two levels up from this file) - no extra setup needed, it's a normal
;     part of this repo.

[env:xteink_x4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board = esp32-c3-devkitm-1
monitor_speed = 115200
upload_speed = 921600

build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DFREEINK_DEVICE_X4=1

build_unflags =
  -std=gnu++11

board_build.flash_mode = dio
board_build.flash_size = 16MB

lib_deps =
  BoardConfig=symlink://../../../freeink-sdk/libs/hardware/BoardConfig
  EInkDisplay=symlink://../../../freeink-sdk/libs/display/FreeInkDisplay
  FreeInkUI=symlink://../../../freeink-sdk/libs/ui/FreeInkUI
  espectre-core=symlink://../../
